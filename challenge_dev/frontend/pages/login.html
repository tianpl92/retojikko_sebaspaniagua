<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Portal de Convocatorias Públicas</title>
  <link rel="stylesheet" href="../sheets/styles.css">
  <script>
    const BACKEND_URL = "http://localhost:8888";
    const ENDPOINTS = {
      LOGIN:       "/login",
      USER_CREATE: "/user-create",
      HEALTH:      "/health",
      USER_INFO:   "/user-info",
      USER_MODIFY: "/user-modify",
      PROPOSALS:   "/public-proposals",
      SAVED_LIST:  "/saved_proposals",
      SAVED_SAVE:  "/saved-proposals",
    };
  </script>
  <script src="../scripts/login.js"></script>
</head>
<body>
  <div class="page-wrapper">
    <div class="card">
      <div class="card-header">
        <h1>Iniciar Sesión</h1>
        <p>Portal de Convocatorias Públicas</p>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="correo@ejemplo.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">LOGIN</button>
      </form>

      <div class="card-footer">
        ¿No estás registrado? — <a href="user-create.html">Crear cuenta aquí</a>
      </div>
    </div>
  </div>
</body>
</html>
