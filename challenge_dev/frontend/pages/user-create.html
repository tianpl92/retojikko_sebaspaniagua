<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta — Portal de Convocatorias Públicas</title>
  <link rel="stylesheet" href="../sheets/styles.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="card">
      <div class="card-header">
        <h1>Crear Cuenta</h1>
        <p>Regístrate en el Portal de Convocatorias</p>
      </div>

      <form>
        <!-- Número de Documento -->
        <div class="form-group">
          <label for="documento">Número de Documento</label>
          <input
            type="text"
            id="documento"
            class="form-input"
            placeholder="Ej. 1234567890"
            required
          >
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="correo@ejemplo.com"
            required
          >
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            required
          >
        </div>

        <!-- Nombres -->
        <div class="form-group">
          <label for="nombres">Nombres</label>
          <input
            type="text"
            id="nombres"
            class="form-input"
            placeholder="Juan Carlos"
            required
          >
        </div>

        <!-- Apellidos -->
        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input
            type="text"
            id="apellidos"
            class="form-input"
            placeholder="Pérez Gómez"
            required
          >
        </div>

        <!-- Género -->
        <div class="form-group">
          <label for="genero">Género</label>
          <select id="genero" class="form-input" required>
            <option value="">Seleccionar</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <!-- Teléfono -->
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input
            type="tel"
            id="telefono"
            class="form-input"
            placeholder="3001234567"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
      </form>

      <div class="card-footer">
        ¿Ya tienes cuenta? — <a href="login.html">Iniciar Sesión</a>
      </div>
    </div>
  </div>
</body>
</html>
